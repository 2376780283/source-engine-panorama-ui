// Named local paths for the hosted panorama UI.
//
// panoramauiclient's SetupNamedPaths() reads this file (CS:GO keeps it inside the packed JS layer,
// this port keeps it loose - see the note in panoramauiclient.cpp) and registers every sub-key under
// "NamedPaths" as a "{name}" prefix for layout/style file references.  {resources} has to point at
// the directory that contains layout/ and styles/, i.e. the mod's own panorama/ folder.
"Panorama"
{
	"NamedPaths"
	{
		"resources"		"panorama/"
		"panorama"		"panorama/"
	}
}
